; https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display]
; LilyGo TTGO T-Display: classic ESP32 (ESP32-D0WDQ6-V3) with a built-in
; ST7789 240x135 SPI TFT. Pinned to a 6.x platform: this code uses the
; Arduino-ESP32 2.x LEDC/timer API (ledcSetup/ledcAttachPin/timerBegin(num,
; div, up)), which was removed in core 3.x (espressif32 7.x). Do not bump to
; 7.x without porting those calls.
platform = espressif32@6.9.0
board = lilygo-t-display
framework = arduino
monitor_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; TFT_eSPI is configured entirely via build flags (no User_Setup.h edits), so
; the display driver + fixed on-board SPI pins travel with the repo. These
; values are the standard LilyGo T-Display wiring (driver ST7789, 135x240,
; MOSI=19 SCLK=18 CS=5 DC=16 RST=23 backlight=4).
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
